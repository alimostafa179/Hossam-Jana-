<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hossam &amp; Jana &middot; Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<link rel="stylesheet" href="motion.css?v=4">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="flower" viewBox="0 0 120 120">
  <g fill="#8fa898" stroke="#6f8a7a" stroke-width=".6"><ellipse cx="90" cy="94" rx="9" ry="23" transform="rotate(-50 90 94)"/><ellipse cx="36" cy="96" rx="8" ry="21" transform="rotate(35 36 96)"/><ellipse cx="102" cy="58" rx="7" ry="17" transform="rotate(-100 102 58)"/><ellipse cx="14" cy="62" rx="6" ry="15" transform="rotate(80 14 62)"/></g>
  <g fill="#d8a93a"><circle cx="108" cy="84" r="2.6"/><circle cx="104" cy="92" r="2"/><circle cx="24" cy="106" r="2.4"/><circle cx="12" cy="84" r="2"/></g>
  <g fill="#fffaf0" stroke="#e1cfa8" stroke-width="1" transform="translate(58 52)">
   <ellipse cx="0" cy="-22" rx="14" ry="19"/><ellipse cx="0" cy="-22" rx="14" ry="19" transform="rotate(72)"/><ellipse cx="0" cy="-22" rx="14" ry="19" transform="rotate(144)"/><ellipse cx="0" cy="-22" rx="14" ry="19" transform="rotate(216)"/><ellipse cx="0" cy="-22" rx="14" ry="19" transform="rotate(288)"/>
   <circle r="8" fill="#e5b84a" stroke="#b8922a"/><circle r="3.4" fill="#fff3c2" stroke="none"/></g>
 </symbol>
 <symbol id="star" viewBox="0 0 18 18"><path d="M9 1L10.8 6.8H17L12 10.4L13.8 16.2L9 12.6L4.2 16.2L6 10.4L1 6.8H7.2Z" fill="none" stroke="#c9a24b" stroke-width=".9"/></symbol>
 <symbol id="flourish" viewBox="0 0 220 24">
  <g fill="none" stroke="#c9a24b" stroke-width="1" stroke-linecap="round">
   <path d="M4 12 H84"/><path d="M136 12 H216"/>
   <path d="M84 12 C96 12 100 4 110 4 C120 4 124 12 136 12"/>
   <path d="M84 12 C96 12 100 20 110 20 C120 20 124 12 136 12"/>
  </g>
  <circle cx="110" cy="12" r="3" fill="#c9a24b"/>
  <circle cx="92" cy="12" r="1.6" fill="#c9a24b"/><circle cx="128" cy="12" r="1.6" fill="#c9a24b"/>
 </symbol>
 <symbol id="corner" viewBox="0 0 90 90">
  <g fill="none" stroke="#c9a24b" stroke-width="1.4" stroke-linecap="round">
   <path d="M4 86 V22 C4 12 12 4 22 4 H86"/>
   <path d="M14 86 V30 C14 20 20 14 30 14 H86" opacity=".45"/>
   <path d="M4 40 C18 40 24 32 24 22 C24 30 30 36 40 36 C30 36 24 42 24 52 C24 42 18 40 4 40 Z" fill="#c9a24b" stroke="none" opacity=".9"/>
  </g>
 </symbol>
</defs></svg>

<div id="prog" aria-hidden="true"></div>
<div id="petals" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="dust" aria-hidden="true"></div>
<audio id="bgm" loop preload="auto"></audio>
<button id="music" aria-label="Toggle music"><s></s><s></s><s></s></button>

<div id="cover">
 <div class="gate gl"></div><div class="gate gr"></div><i class="beam"></i>
 <div class="cv-in">
 <svg class="draw" aria-hidden="true"><rect x="0.5" y="0.5" width="99.9%" height="99.9%" pathLength="1"/></svg>
 <div class="frame-line"></div>
 <svg class="cnr c-tl"><use href="#corner"/></svg><svg class="cnr c-tr"><use href="#corner"/></svg>
 <svg class="cnr c-bl"><use href="#corner"/></svg><svg class="cnr c-br"><use href="#corner"/></svg>
 <svg class="fx tl sway"><use href="#flower"/></svg><svg class="fx tr sway s3"><use href="#flower"/></svg>
 <svg class="fx bl sway s2"><use href="#flower"/></svg><svg class="fx br sway"><use href="#flower"/></svg>
 <p class="tag">You are invited</p>
 <div class="cover-photo ring"><img src="WhatsApp Image 2026-10-17 at 3.35.59 PM.jpeg" alt="Hossam and Jana"></div>
 <h1 class="names cover-names"><span id="c1"></span><span class="amp">&amp;</span><span id="c2"></span></h1>
 <svg class="flourish" viewBox="0 0 220 24"><use href="#flourish"/></svg>
 <p class="cover-date" id="cDate"></p>
 <button class="open-btn" id="openBtn">Open Invitation</button>
 </div>
</div>

<main id="main">
<section class="hero">
 <div class="rays" aria-hidden="true"></div>
 <svg class="fx h-l sway" data-par=".18"><use href="#flower"/></svg><svg class="fx h-r sway s2" data-par="-.12"><use href="#flower"/></svg>
 <p class="tag r">Wedding Invitation</p>
 <div class="arch r"><div class="arch-in"><img data-pimg src="WhatsApp Image 2026-10-17 at 3.35.59 PM.jpeg" alt="Hossam and Jana"></div></div>
 <p class="together r">Together with their families</p>
 <h1 class="names r"><span id="n1"></span><span class="amp">&amp;</span><span id="n2"></span></h1>
 <p class="subtitle r">Request the honour of your presence</p>
 <div class="ornament r"><svg width="16" height="16"><use href="#star"/></svg></div>
 <p class="tag r">at their wedding celebration</p>
</section>

<section class="details-section">
 <p class="section-label r">The Details</p>
 <svg class="flourish gold r" viewBox="0 0 220 24"><use href="#flourish"/></svg>
 <div class="details-grid r">
  <div class="detail-block">
   <svg class="detail-icon" viewBox="0 0 28 28" fill="none" stroke="#c9a24b" stroke-width=".9"><rect x="3" y="5" width="22" height="20" rx="1"/><path d="M3 11h22M9 3v5M19 3v5"/><text id="icoDay" x="14" y="22" text-anchor="middle" font-size="8" fill="#c9a24b" stroke="none"></text></svg>
   <span class="detail-label">Date</span><div class="detail-value" id="dVal"></div><span class="detail-sub" id="dSub"></span>
  </div>
  <div class="detail-block">
   <svg class="detail-icon" viewBox="0 0 28 28" fill="none" stroke="#c9a24b" stroke-width=".9"><circle cx="14" cy="14" r="10"/><path d="M14 14V7M14 14h5"/><circle cx="14" cy="14" r="1.2" fill="#c9a24b"/></svg>
   <span class="detail-label">Time</span><div class="detail-value" id="tVal"></div><span class="detail-sub" id="tSub"></span>
  </div>
 </div>
 <div class="countdown r" id="countdown">
  <div class="cd-box"><span class="cd-num" id="cdD">0</span><span class="cd-lab">Days</span></div>
  <div class="cd-box"><span class="cd-num" id="cdH">0</span><span class="cd-lab">Hours</span></div>
  <div class="cd-box"><span class="cd-num" id="cdM">0</span><span class="cd-lab">Minutes</span></div>
  <div class="cd-box"><span class="cd-num" id="cdS">0</span><span class="cd-lab">Seconds</span></div>
 </div>
 <p class="count r" id="count"></p>
</section>

<section class="map-section">
 <svg class="fx m-r sway" data-par=".15"><use href="#flower"/></svg>
 <p class="section-label r">Venue</p>
 <div class="ornament r"><svg width="14" height="14"><use href="#star"/></svg></div>
 <div class="venue-name r"><span class="vn" id="vName"></span></div>
 <p class="venue-address r" id="vAddr"></p>
 <div class="map-wrapper r"><div class="map-inner">
  <div class="map-panel">
   <div class="map-pin"><svg width="34" height="44" viewBox="0 0 10 12"><path d="M5 0C2.8 0 1 1.8 1 4C1 7 5 12 5 12C5 12 9 7 9 4C9 1.8 7.2 0 5 0ZM5 5.5C4.2 5.5 3.5 4.8 3.5 4C3.5 3.2 4.2 2.5 5 2.5C5.8 2.5 6.5 3.2 6.5 4C6.5 4.8 5.8 5.5 5 5.5Z" fill="#c9a24b"/></svg><span class="map-pin-ring"></span></div>
   <div class="map-panel-name" id="vName2"></div><div class="map-panel-coords" id="vArea"></div>
  </div>
  <div class="map-address-bar"><div class="map-address-text" id="vFull"></div><a class="map-btn" id="dir" target="_blank" rel="noopener">Get Directions</a></div>
 </div></div>
 <div class="acts r"><a class="map-btn ghost" id="gcal" target="_blank" rel="noopener">Add to Calendar</a><a class="map-btn solid" id="rsvp" target="_blank" rel="noopener">RSVP on WhatsApp</a></div>
</section>

<footer>
 <svg class="flourish" viewBox="0 0 220 24"><use href="#flourish"/></svg>
 <div class="footer-names" id="fNames"></div>
 <p class="footer-note" id="fNote"></p>
</footer>
</main>
<script src="script.js?v=4"></script>
</body>
</html>
